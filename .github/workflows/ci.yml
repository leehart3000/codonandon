name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Set up Node (version from .node-version)
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run check

      - name: Lint (Prettier + ESLint)
        run: pnpm run lint

      - name: Install test browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Unit and component tests (Vitest)
        run: pnpm run test:unit --run

      - name: Browser tests (Playwright)
        run: pnpm run test:e2e

  secret-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code (with full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan for leaked secrets (TruffleHog)
        uses: trufflesecurity/trufflehog@v3.99.2
        with:
          extra_args: --results=verified,unknown

  deploy:
    needs: [check-and-test, secret-scan]
    # Deploy only from main, and only in repos that have switched deploys on
    # (Settings → Secrets and variables → Actions → Variables: DEPLOY_ENABLED = true).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Set up Node (version from .node-version)
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Deploy to Cloudflare
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
