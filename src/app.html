<html lang="en">
	<head>

		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		%sveltekit.head%

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<!-- Cloudflare Web Analytics: cookieless, no personal data. The token is public by design. -->
		<script>
			// Cloudflare Web Analytics: only on the live site, not the dev server or previews.
			if (location.hostname === 'tetraminos.hartsoft.dev') {
				const beacon = document.createElement('script');
				beacon.defer = true;
				beacon.src = 'https://static.cloudflareinsights.com/beacon.min.js';
				beacon.dataset.cfBeacon = JSON.stringify({ token: 'b4b7903030f74d21b61b972e398c3e04' });
				document.head.append(beacon);
			}
		</script>
	</body>
</html>
